# Windows 版云端打包：代码推送到 main 分支时自动构建，
# 产物发布到 GitHub Releases（也可以在 Actions 页面手动触发）。
name: 打包 Windows 版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布 Windows 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "黑马记账 v__VERSION__"
          args: --bundles nsis
